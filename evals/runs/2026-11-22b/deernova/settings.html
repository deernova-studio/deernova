<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>设置</title>
<link rel="stylesheet" href="../../../../skills/deernova-style/assets/tokens.css">
<style>
/* ---------- 全局 ---------- */
html, body { height: 100%; margin: 0; }
body { overflow: hidden; background: var(--canvas); color: var(--ink); font: var(--type-body); -webkit-font-smoothing: antialiased; }
:focus-visible { outline: var(--stroke-focus) solid var(--focus-ring); outline-offset: var(--focus-offset); }
:is(input:not([type="checkbox"], [type="radio"], [type="range"], [type="button"], [type="submit"], [type="reset"]), textarea, select, [contenteditable]):focus-visible { outline: none; }
[hidden] { display: none !important; }

@supports selector(::-webkit-scrollbar) {
  ::-webkit-scrollbar { width: var(--scrollbar-size); height: var(--scrollbar-size); }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-thumb { border: calc((var(--scrollbar-size) - var(--scrollbar-thumb-size)) / 2) solid transparent; border-radius: var(--radius-full); background: var(--line-control) padding-box; }
  ::-webkit-scrollbar-thumb:hover, ::-webkit-scrollbar-thumb:active { background-color: var(--ink-tertiary); }
  ::-webkit-scrollbar-button { display: none; }
}
@supports not selector(::-webkit-scrollbar) {
  * { scrollbar-width: thin; scrollbar-color: var(--line-control) transparent; }
}

/* ---------- 图标 ---------- */
.dn-icon { width: var(--icon-size-md); height: var(--icon-size-md); flex: none; fill: none; stroke: currentColor; stroke-width: var(--icon-stroke); stroke-linecap: var(--line-cap); stroke-linejoin: var(--line-join); }

/* ---------- 骨架：顶栏 ---------- */
.dn-app { display: grid; grid-template-columns: minmax(0, 1fr); height: 100dvh; background: var(--canvas); color: var(--ink); }
.dn-app-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.dn-toolbar { position: sticky; top: 0; z-index: var(--z-sticky); display: flex; align-items: center; gap: var(--space-1); height: var(--toolbar-height); padding: 0 var(--space-2) 0 var(--space-3); box-sizing: border-box; border-bottom: var(--stroke-line) solid var(--line); background: var(--canvas); flex: none; }
.dn-toolbar-title { display: inline-flex; align-items: center; gap: var(--space-1); min-width: 0; height: var(--button-height-md); margin: 0; padding: 0 var(--space-2); border: 0; border-radius: var(--button-radius); background: transparent; color: var(--ink); font: var(--weight-regular) var(--toolbar-title-size)/1 var(--font-sans); }
.dn-toolbar-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- 按钮 ---------- */
.dn-button {
  position: relative; isolation: isolate; display: inline-flex; align-items: center; justify-content: center; gap: var(--gap-inline);
  height: var(--button-height-md); padding: 0 var(--button-padding-x-md); border: 0; border-radius: var(--button-radius); background: none; color: var(--ink);
  font: calc(var(--button-font-weight) + var(--weight-shift)) var(--button-font-size-md)/1 var(--font-sans);
  white-space: nowrap; text-decoration: none; cursor: pointer;
  transition: color var(--duration-instant) var(--ease-standard), opacity var(--duration-instant) var(--ease-standard);
}
.dn-button:focus-visible { outline: var(--stroke-focus) solid var(--focus-ring); outline-offset: var(--focus-offset); }
.dn-button:disabled { opacity: var(--opacity-disabled); cursor: default; }
.dn-button.is-primary { color: var(--on-accent); }
.dn-button.is-primary::after { background-color: var(--accent); }
@media (hover: hover) { .dn-button.is-primary:hover:not(:disabled) { opacity: var(--opacity-solid-hover); } }
.dn-button.is-primary:active:not(:disabled) { opacity: var(--opacity-solid-hover); }
.dn-button.is-plain { color: var(--ink-secondary); }
.dn-button.is-plain::after { background-color: transparent; }
@media (hover: hover) { .dn-button.is-plain:hover:not(:disabled) { color: var(--ink); } }
.dn-button.is-plain:active:not(:disabled) { color: var(--ink); }
.dn-button.is-danger { color: var(--danger); }
.dn-button.is-danger::after { background-color: var(--danger-soft); }
.dn-button.is-primary.is-danger { color: var(--on-accent); }
.dn-button.is-primary.is-danger::after { background-color: var(--danger); }
.dn-button.is-sm { height: var(--button-height-sm); padding: 0 var(--button-padding-x-sm); border-radius: var(--button-radius-sm); font-size: var(--button-font-size-sm); }

.dn-icon-button { position: relative; isolation: isolate; display: inline-grid; place-items: center; flex: none; width: var(--button-height-md); height: var(--button-height-md); padding: 0; border: 0; border-radius: var(--button-radius); background: none; color: var(--ink-secondary); cursor: pointer; transition: color var(--duration-instant) var(--ease-standard); }
@media (hover: hover) { .dn-icon-button:hover { color: var(--ink); } }
.dn-icon-button:active { color: var(--ink); }
.dn-icon-button:focus-visible { outline: var(--stroke-focus) solid var(--focus-ring); outline-offset: var(--focus-offset); }

.dn-button::after, .dn-icon-button::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; background-color: var(--fill-selected); transition: background-color var(--duration-instant) var(--ease-standard), transform var(--duration-release) var(--ease-release); }
.dn-icon-button::after { background-color: transparent; }
@media (hover: hover) {
  .dn-button:hover:not(:disabled)::after { background-image: linear-gradient(var(--fill-hover), var(--fill-hover)); }
  .dn-button.is-primary:hover::after, .dn-button.is-primary.is-danger:hover::after { background-image: none; }
  .dn-button.is-plain:hover:not(:disabled)::after, .dn-icon-button:hover::after { background-color: var(--fill-hover); background-image: none; }
}
.dn-button:active:not(:disabled)::after { background-image: linear-gradient(var(--fill-selected), var(--fill-selected)); }
.dn-button.is-primary:active::after { background-image: none; }
.dn-button.is-plain:active:not(:disabled)::after, .dn-icon-button:active::after { background-color: var(--fill-selected); background-image: none; }
@media (prefers-reduced-motion: no-preference) {
  :is(.dn-button, .dn-icon-button):active:not(:disabled)::after { transform: scale(var(--press-scale)); transition: background-color var(--duration-instant) var(--ease-standard), transform var(--duration-press) var(--ease-standard); }
}
.dn-button::before, .dn-icon-button::before { content: ""; position: absolute; top: 50%; left: 50%; width: max(100%, var(--hit-min)); height: max(100%, var(--hit-min)); transform: translate(-50%, -50%); }

/* ---------- Tooltip（工具栏里的简单定位） ---------- */
.dn-tooltip { box-sizing: border-box; display: flex; align-items: center; width: max-content; max-width: min(var(--tooltip-max-width), 100vw - 2 * var(--space-2)); min-height: var(--tooltip-height); margin: 0; padding: var(--space-1) var(--tooltip-padding-x); border-radius: var(--tooltip-radius); background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-float); font: var(--weight-regular) var(--tooltip-font-size)/var(--type-caption-line) var(--font-sans); }
.dn-tooltip-anchor { position: relative; display: inline-flex; }
.dn-tooltip-anchor > .dn-tooltip { position: absolute; top: calc(100% + var(--tooltip-offset)); left: 0; z-index: var(--z-tooltip); pointer-events: none; opacity: 0; visibility: hidden; transition: opacity var(--duration-instant) var(--ease-exit), visibility 0s linear var(--duration-instant); }
@media (hover: hover) and (pointer: fine) {
  .dn-tooltip-anchor:hover > .dn-tooltip { opacity: 1; visibility: visible; transition: opacity var(--duration-instant) var(--ease-enter) var(--tooltip-delay), visibility 0s linear var(--tooltip-delay); }
}
.dn-tooltip-anchor:has(:focus-visible) > .dn-tooltip { opacity: 1; visibility: visible; transition: opacity var(--duration-instant) var(--ease-enter); }
.dn-tooltip-anchor:has(:active) > .dn-tooltip { opacity: 0; visibility: hidden; transition: none; }

/* ---------- 设置页骨架（deernova-page / 设置页） ---------- */
.dn-settings { display: grid; grid-template-columns: 220px minmax(0, 1fr); flex: 1; min-height: 0; }
.dn-settings-nav { display: flex; flex-direction: column; gap: var(--row-gap); min-height: 0; overflow-y: auto; padding: var(--space-3) var(--space-2); border-right: var(--stroke-line) solid var(--line); }
.dn-settings-main { min-width: 0; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: var(--space-6) max(var(--page-margin), calc((100% - var(--form-max)) / 2)) var(--space-12); }
.dn-settings-main h2 { margin: 0 0 var(--space-5); font: var(--type-title); }
.dn-settings-main h2:focus { outline: none; }

/* 分类项沿用侧边栏项 */
.dn-sidebar-item { display: flex; align-items: center; gap: var(--space-2); min-width: 0; min-height: var(--row-height); padding: 0 var(--row-padding-x); border-radius: var(--row-radius); color: var(--ink); font: var(--type-body); text-decoration: none; transition: background-color var(--duration-instant) var(--ease-standard); }
.dn-sidebar-item .dn-icon { width: var(--icon-size-md); height: var(--icon-size-md); color: var(--ink-secondary); }
@media (hover: hover) { .dn-sidebar-item:hover { background: var(--fill-hover); } }
.dn-sidebar-item:active { background: var(--fill-selected); }
.dn-sidebar-item[aria-current="page"] { background: var(--fill-selected); }
.dn-sidebar-item:focus-visible { outline: var(--stroke-focus) solid var(--focus-ring); outline-offset: calc(-1 * var(--stroke-focus)); }
.dn-sidebar-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dn-sidebar-item > .dn-chevron { display: none; width: var(--icon-size-sm); height: var(--icon-size-sm); color: var(--ink-tertiary); }

/* ---------- 分组列表 ---------- */
.dn-list-section { display: grid; gap: var(--space-2); }
.dn-list-section + .dn-list-section { margin-top: var(--gap-group); }
.dn-list-header, .dn-list-footer { margin: 0; padding: 0 var(--row-padding-x); font: var(--weight-regular) var(--type-footnote-size)/var(--type-footnote-line) var(--font-sans); }
.dn-list-footer { color: var(--ink-tertiary); }
.dn-list { margin: 0; padding: 0; overflow: hidden; list-style: none; border-radius: var(--card-radius); background: var(--surface-raised); }
.dn-list-row { --separator-inset: var(--row-padding-x); position: relative; display: flex; align-items: center; gap: var(--space-3); min-height: var(--row-height); padding: 0 var(--row-padding-x); color: var(--ink); font: var(--type-body); }
.dn-list-row + .dn-list-row::before { content: ""; position: absolute; top: 0; right: 0; left: var(--separator-inset); border-top: var(--stroke-line) var(--line-style-divider) var(--line); }
.dn-list-value { margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--ink-secondary); white-space: nowrap; }
.dn-list-row .dn-chevron { flex: none; width: var(--icon-size-sm); height: var(--icon-size-sm); margin-left: auto; color: var(--ink-tertiary); }
.dn-list-value + .dn-chevron { margin-left: 0; }
.dn-list-row:has(> .dn-item-text > .dn-item-detail:not([hidden])) { padding-block: var(--space-2); }
.dn-list-row > .dn-item-text { flex: 1; min-width: 9em; }
.dn-list-row > .dn-list-label { flex: none; white-space: nowrap; }
.dn-list-control { display: flex; flex: 0 1 300px; align-items: center; justify-content: flex-end; gap: var(--space-2); min-width: 0; margin-left: auto; }
.dn-list-control > :is(.dn-input, .dn-segmented) { flex: 1; min-width: 0; }
.dn-list-control > .dn-segmented > button { flex: 1; }
.dn-list-control > :is(.dn-switch, .dn-button) { flex: none; margin-left: 0; }

/* 整行可点的行：链接撑满整行 */
.dn-list-row.is-link { cursor: pointer; transition: background-color var(--duration-instant) var(--ease-standard); }
@media (hover: hover) { .dn-list-row.is-link:hover { background: var(--fill-hover); } }
.dn-list-row.is-link:active { background: var(--fill-selected); }
.dn-row-link { flex: none; color: inherit; text-decoration: none; white-space: nowrap; }
.dn-row-link::after { content: ""; position: absolute; inset: 0; }
.dn-row-link:focus-visible { outline: none; }
.dn-list-row.is-link:has(> .dn-row-link:focus-visible) { outline: var(--stroke-focus) solid var(--focus-ring); outline-offset: calc(-1 * var(--stroke-focus)); }

/* 名字加一行说明 */
.dn-item-text { display: grid; gap: 2px; min-width: 0; }
.dn-item-title { margin: 0; color: var(--ink); font: inherit; overflow-wrap: anywhere; }
.dn-item-detail { margin: 0; color: var(--ink-secondary); font: var(--type-footnote); }
.dn-item-detail.is-danger { color: var(--danger); }

/* 开关 */
.dn-switch { position: relative; flex: none; width: var(--switch-width); height: var(--switch-height); margin: 0 0 0 auto; border-radius: var(--radius-full); background: var(--fill-selected); appearance: none; -webkit-appearance: none; cursor: pointer; transition: background-color var(--duration-base) var(--ease-standard); }
.dn-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: calc(var(--switch-height) - 4px); height: calc(var(--switch-height) - 4px); border-radius: var(--radius-full); background: var(--knob); box-shadow: var(--shadow-control); transition: transform var(--duration-base) var(--ease-standard); }
.dn-switch:checked { background: var(--accent); }
.dn-switch:checked::after { background: var(--on-accent); transform: translateX(calc(var(--switch-width) - var(--switch-height))); }
.dn-switch:focus-visible { outline: var(--stroke-focus) solid var(--focus-ring); outline-offset: var(--focus-offset); }
label[for] { cursor: pointer; }

/* 文本框 */
.dn-field { display: grid; gap: var(--space-1); min-width: 0; }
.dn-field-label { color: var(--ink-secondary); font: var(--weight-medium) var(--type-callout-size)/var(--type-callout-line) var(--font-sans); }
.dn-input { box-sizing: border-box; width: 100%; height: var(--field-height); padding: 0 var(--field-padding-x); border: var(--stroke-line) solid var(--line); border-radius: var(--field-radius); background: var(--surface-sunken); color: var(--ink); font: var(--weight-regular) var(--field-font-size)/1.2 var(--font-sans); transition: background-color var(--duration-instant) var(--ease-standard), box-shadow var(--duration-instant) var(--ease-standard); }
.dn-input::placeholder { color: var(--ink-tertiary); }
.dn-input:focus { outline: none; background: var(--surface-raised); box-shadow: var(--shadow-control); }
.dn-input[aria-invalid="true"], .dn-input[aria-invalid="true"]:focus { background: var(--danger-soft); }

/* 分段控件 */
.dn-segmented { display: inline-flex; gap: 2px; padding: var(--segmented-padding); border-radius: var(--segmented-radius); background: var(--fill-selected); }
.dn-segmented button { position: relative; height: var(--segmented-height); padding: 0 var(--segmented-padding-x); border: 0; border-radius: calc(var(--segmented-radius) - var(--segmented-padding)); background: transparent; color: var(--ink-secondary); font: var(--weight-medium) var(--segmented-font-size)/1 var(--font-sans); white-space: nowrap; cursor: pointer; transition: background-color var(--duration-instant) var(--ease-standard), color var(--duration-instant) var(--ease-standard); }
@media (hover: hover) { .dn-segmented button:hover { color: var(--ink); } }
.dn-segmented button[aria-pressed="true"] { background: var(--surface-raised); color: var(--ink); box-shadow: var(--shadow-control); }
.dn-segmented button:focus-visible { outline: var(--stroke-focus) solid var(--focus-ring); outline-offset: calc(-1 * var(--stroke-focus)); }

/* ---------- 弹窗 ---------- */
.dn-sheet { box-sizing: border-box; display: flex; flex-direction: column; width: min(100% - 2 * var(--sheet-margin), var(--sheet-width-md)); max-width: none; max-height: calc(100dvh - 2 * var(--sheet-margin)); padding: 0; overflow: hidden; border: var(--stroke-line) solid var(--line); border-radius: var(--sheet-radius); background: var(--surface-raised); color: var(--ink); box-shadow: var(--shadow-float); transition: opacity var(--duration-slow) var(--ease-enter), transform var(--duration-slow) var(--ease-enter), overlay var(--duration-slow) allow-discrete, display var(--duration-slow) allow-discrete; }
dialog.dn-sheet:not([open]) { display: none; opacity: 0; transform: scale(0.96); transition-duration: var(--duration-base); transition-timing-function: var(--ease-exit); }
.dn-sheet.is-sm { width: min(100% - 2 * var(--sheet-margin), var(--sheet-width-sm)); }
.dn-sheet::backdrop { background: var(--scrim); transition: opacity var(--duration-slow) var(--ease-enter), overlay var(--duration-slow) allow-discrete, display var(--duration-slow) allow-discrete; }
dialog.dn-sheet:not([open])::backdrop { opacity: 0; transition-duration: var(--duration-base); transition-timing-function: var(--ease-exit); }
@starting-style {
  .dn-sheet[open] { opacity: 0; transform: scale(0.96); }
  .dn-sheet[open]::backdrop { opacity: 0; }
}
.dn-sheet > form { display: contents; }
.dn-sheet-grabber { flex: none; width: var(--sheet-grabber-width); height: var(--sheet-grabber-height); margin: var(--space-2) auto 0; border-radius: var(--radius-full); background: var(--line-control); }
.dn-sheet-head { flex: none; display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--sheet-padding) var(--sheet-padding) 0; }
.dn-sheet-heading { flex: 1; min-width: 0; }
.dn-sheet-title { margin: 0; font: var(--type-title); overflow-wrap: anywhere; }
.dn-sheet-description { margin: var(--space-1) 0 0; color: var(--ink-secondary); font: var(--type-callout); }
.dn-sheet-content { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: var(--space-4) var(--sheet-padding) 0; }
.dn-sheet-actions { flex: none; display: flex; justify-content: flex-end; gap: var(--gap-stack); padding: var(--space-4) var(--sheet-padding) var(--sheet-padding); }
.dn-mono { font-family: var(--font-mono); overflow-wrap: anywhere; }
@media (pointer: coarse) {
  .dn-sheet { transition-timing-function: var(--ease-drawer); }
  .dn-sheet[open] { margin: auto auto calc(var(--sheet-margin) + env(safe-area-inset-bottom)); }
  dialog.dn-sheet:not([open]) { opacity: 1; transform: translateY(calc(100% + var(--sheet-margin) + env(safe-area-inset-bottom))); transition-timing-function: var(--ease-drawer); }
  @starting-style { .dn-sheet[open] { opacity: 1; transform: translateY(calc(100% + var(--sheet-margin) + env(safe-area-inset-bottom))); } }
  .dn-sheet-actions { flex-direction: column-reverse; gap: var(--space-1); }
  .dn-sheet-actions .dn-button { width: 100%; height: var(--button-height-lg); }
}
@media (pointer: fine) { .dn-sheet-grabber { display: none; } }
@media (prefers-reduced-motion: reduce) {
  dialog.dn-sheet:not([open]) { opacity: 0; transform: none; }
  @starting-style { .dn-sheet[open] { opacity: 0; transform: none; } }
}

/* ---------- 窄屏：分类是第一页，点进去是设置 ---------- */
@media (max-width: 960px) {
  .dn-settings { grid-template-columns: minmax(0, 1fr); }
  .dn-settings-nav { border-right: 0; padding: var(--space-3) var(--page-margin); }
  .dn-sidebar-item > .dn-chevron { display: block; }
  .dn-sidebar-item[aria-current="page"] { background: transparent; }
  .dn-settings[data-view="nav"] .dn-settings-main { display: none; }
  .dn-settings[data-view="detail"] .dn-settings-nav { display: none; }
}
</style>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="dn-user" viewBox="0 0 24 24"><path d="M8.25 7.75a3.75 3.75 0 1 0 7.5 0a3.75 3.75 0 1 0 -7.5 0"/><path d="M4.75 20.25C4.75 16.6 7.9 14.25 12 14.25S19.25 16.6 19.25 20.25"/></symbol>
  <symbol id="dn-bell" viewBox="0 0 24 24"><path d="M6.75 9.25a5.25 5.25 0 0 1 10.5 0V13.5L19.25 16.75H4.75L6.75 13.5Z"/><path d="M10.25 20a2 2 0 0 0 3.5 0"/></symbol>
  <symbol id="dn-options" viewBox="0 0 24 24"><path d="M4 7H12.75"/><path d="M17.75 7H20"/><path d="M4 17H6.25"/><path d="M11.25 17H20"/><path d="M12.75 7a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0"/><path d="M6.25 17a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0"/></symbol>
  <symbol id="dn-permission" viewBox="0 0 24 24"><path d="M12 3.5L19 6.25V11.5c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6.25Z"/><path d="M9 12L11 14L15 10"/></symbol>
  <symbol id="dn-chevron-right" viewBox="0 0 24 24"><path d="M9.75 7l4.5 5-4.5 5"/></symbol>
  <symbol id="dn-back" viewBox="0 0 24 24"><path d="M11.5 18.5L5 12L11.5 5.5"/><path d="M19 12H5.5"/></symbol>
</svg>

<div class="dn-app">
  <div class="dn-app-main">
    <header class="dn-toolbar">
      <span class="dn-tooltip-anchor">
        <button class="dn-icon-button" id="back" type="button" aria-label="返回笔记"><svg class="dn-icon" aria-hidden="true"><use href="#dn-back"/></svg></button>
        <span class="dn-tooltip" id="back-tip" aria-hidden="true">返回笔记</span>
      </span>
      <h1 class="dn-toolbar-title"><span id="toolbar-title">设置</span></h1>
    </header>

    <div class="dn-settings" id="settings" data-view="detail">
      <nav class="dn-settings-nav" aria-label="设置分类">
        <a class="dn-sidebar-item" href="#account" data-panel="account" aria-current="page"><svg class="dn-icon" aria-hidden="true"><use href="#dn-user"/></svg><span class="dn-sidebar-label">账户</span><svg class="dn-icon dn-chevron" aria-hidden="true"><use href="#dn-chevron-right"/></svg></a>
        <a class="dn-sidebar-item" href="#notifications" data-panel="notifications"><svg class="dn-icon" aria-hidden="true"><use href="#dn-bell"/></svg><span class="dn-sidebar-label">通知</span><svg class="dn-icon dn-chevron" aria-hidden="true"><use href="#dn-chevron-right"/></svg></a>
        <a class="dn-sidebar-item" href="#appearance" data-panel="appearance"><svg class="dn-icon" aria-hidden="true"><use href="#dn-options"/></svg><span class="dn-sidebar-label">外观</span><svg class="dn-icon dn-chevron" aria-hidden="true"><use href="#dn-chevron-right"/></svg></a>
        <a class="dn-sidebar-item" href="#privacy" data-panel="privacy"><svg class="dn-icon" aria-hidden="true"><use href="#dn-permission"/></svg><span class="dn-sidebar-label">隐私</span><svg class="dn-icon dn-chevron" aria-hidden="true"><use href="#dn-chevron-right"/></svg></a>
      </nav>

      <div class="dn-settings-main" id="settings-main">
        <!-- 账户 -->
        <section class="dn-settings-panel" id="panel-account" aria-labelledby="h-account">
          <h2 id="h-account" tabindex="-1">账户</h2>
          <section class="dn-list-section">
            <ul class="dn-list">
              <li class="dn-list-row">
                <span class="dn-item-text">
                  <label class="dn-item-title" for="acc-name">名字</label>
                  <span class="dn-item-detail is-danger" id="acc-name-msg" hidden></span>
                </span>
                <span class="dn-list-control"><input class="dn-input" id="acc-name" type="text" value="陈思远" autocomplete="name" maxlength="40" aria-describedby="acc-name-msg"></span>
              </li>
              <li class="dn-list-row">
                <span class="dn-item-text">
                  <label class="dn-item-title" for="acc-email">邮箱</label>
                  <span class="dn-item-detail" id="acc-email-msg" hidden></span>
                </span>
                <span class="dn-list-control"><input class="dn-input" id="acc-email" type="email" value="siyuan.chen@icloud.com" autocomplete="email" spellcheck="false" aria-describedby="acc-email-msg"></span>
              </li>
              <li class="dn-list-row is-link">
                <a class="dn-row-link" href="#billing">订阅</a>
                <span class="dn-list-value">个人版，按年</span>
                <svg class="dn-icon dn-chevron" aria-hidden="true"><use href="#dn-chevron-right"/></svg>
              </li>
            </ul>
          </section>

          <section class="dn-list-section">
            <ul class="dn-list">
              <li class="dn-list-row"><label for="acc-sync">iCloud 同步</label><input class="dn-switch" id="acc-sync" type="checkbox" role="switch" checked aria-describedby="acc-sync-note"></li>
            </ul>
            <p class="dn-list-footer" id="acc-sync-note">关闭后，新笔记只保存在这台设备上。</p>
          </section>

          <section class="dn-list-section">
            <ul class="dn-list">
              <li class="dn-list-row"><span class="dn-list-label">退出登录</span><span class="dn-list-control"><button class="dn-button is-sm" id="sign-out" type="button">退出</button></span></li>
              <li class="dn-list-row"><span class="dn-list-label">删除账户</span><span class="dn-list-control"><button class="dn-button is-danger is-sm" id="delete-open" type="button" aria-haspopup="dialog">删除…</button></span></li>
            </ul>
          </section>
        </section>

        <!-- 通知 -->
        <section class="dn-settings-panel" id="panel-notifications" aria-labelledby="h-notifications" hidden>
          <h2 id="h-notifications" tabindex="-1">通知</h2>
          <section class="dn-list-section">
            <ul class="dn-list">
              <li class="dn-list-row"><label for="n-remind">笔记提醒</label><input class="dn-switch" id="n-remind" type="checkbox" role="switch" checked></li>
              <li class="dn-list-row"><label for="n-mention">评论和提及</label><input class="dn-switch" id="n-mention" type="checkbox" role="switch" checked></li>
              <li class="dn-list-row"><label for="n-shared">共享笔记的改动</label><input class="dn-switch" id="n-shared" type="checkbox" role="switch"></li>
            </ul>
          </section>
          <section class="dn-list-section">
            <ul class="dn-list">
              <li class="dn-list-row"><label for="n-sound">通知声音</label><input class="dn-switch" id="n-sound" type="checkbox" role="switch" checked></li>
            </ul>
          </section>
        </section>

        <!-- 外观 -->
        <section class="dn-settings-panel" id="panel-appearance" aria-labelledby="h-appearance" hidden>
          <h2 id="h-appearance" tabindex="-1">外观</h2>
          <section class="dn-list-section">
            <ul class="dn-list">
              <li class="dn-list-row"><span class="dn-list-label" id="l-theme">外观</span><span class="dn-list-control"><span class="dn-segmented" id="theme" role="group" aria-labelledby="l-theme"><button type="button" data-theme-value="" aria-pressed="true">跟随系统</button><button type="button" data-theme-value="light" aria-pressed="false">浅色</button><button type="button" data-theme-value="dark" aria-pressed="false">深色</button></span></span></li>
              <li class="dn-list-row"><span class="dn-list-label" id="l-size">正文字号</span><span class="dn-list-control"><span class="dn-segmented" id="text-size" role="group" aria-labelledby="l-size"><button type="button" aria-pressed="false">小</button><button type="button" aria-pressed="true">标准</button><button type="button" aria-pressed="false">大</button></span></span></li>
            </ul>
          </section>
        </section>

        <!-- 隐私 -->
        <section class="dn-settings-panel" id="panel-privacy" aria-labelledby="h-privacy" hidden>
          <h2 id="h-privacy" tabindex="-1">隐私</h2>
          <section class="dn-list-section">
            <ul class="dn-list">
              <li class="dn-list-row is-link"><a class="dn-row-link" href="#lock">锁定笔记</a><span class="dn-list-value">已设置密码</span><svg class="dn-icon dn-chevron" aria-hidden="true"><use href="#dn-chevron-right"/></svg></li>
              <li class="dn-list-row is-link"><a class="dn-row-link" href="#devices">已登录的设备</a><span class="dn-list-value">3 台</span><svg class="dn-icon dn-chevron" aria-hidden="true"><use href="#dn-chevron-right"/></svg></li>
            </ul>
          </section>
          <section class="dn-list-section">
            <ul class="dn-list">
              <li class="dn-list-row"><label for="p-diag">发送诊断数据</label><input class="dn-switch" id="p-diag" type="checkbox" role="switch" aria-describedby="p-diag-note"></li>
            </ul>
            <p class="dn-list-footer" id="p-diag-note">只包含崩溃和性能数据，不包含笔记内容。</p>
          </section>
        </section>
      </div>
    </div>
  </div>
</div>

<dialog class="dn-sheet is-sm" id="delete-dialog" role="alertdialog" aria-labelledby="delete-title" aria-describedby="delete-desc">
  <form id="delete-form" novalidate>
    <div class="dn-sheet-grabber" aria-hidden="true"></div>
    <div class="dn-sheet-head">
      <div class="dn-sheet-heading">
        <h3 class="dn-sheet-title" id="delete-title">删除账户“<span id="delete-name">陈思远</span>”？</h3>
        <p class="dn-sheet-description" id="delete-desc">全部笔记会从所有设备和 iCloud 上删除，无法恢复；个人版订阅同时取消。</p>
      </div>
    </div>
    <div class="dn-sheet-content">
      <div class="dn-field">
        <label class="dn-field-label" for="delete-confirm">输入 <span class="dn-mono" id="delete-email">siyuan.chen@icloud.com</span> 确认</label>
        <input class="dn-input" id="delete-confirm" type="text" autocomplete="off" spellcheck="false" autofocus>
      </div>
    </div>
    <div class="dn-sheet-actions">
      <button class="dn-button is-plain" id="delete-cancel" type="button">取消</button>
      <button class="dn-button is-primary is-danger" id="delete-submit" type="button" disabled>删除账户</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  const settings = document.getElementById('settings');
  const main = document.getElementById('settings-main');
  const navLinks = [...document.querySelectorAll('.dn-settings-nav [data-panel]')];
  const back = document.getElementById('back');
  const backTip = document.getElementById('back-tip');
  const toolbarTitle = document.getElementById('toolbar-title');
  const narrow = window.matchMedia('(max-width: 960px)');
  const panels = ['account', 'notifications', 'appearance', 'privacy'];
  let current = panels.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'account';
  let view = narrow.matches && !location.hash ? 'nav' : 'detail';

  function render() {
    navLinks.forEach(a => {
      if (a.dataset.panel === current) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
    panels.forEach(p => { document.getElementById('panel-' + p).hidden = p !== current; });
    settings.dataset.view = narrow.matches ? view : 'detail';
    const inCategory = narrow.matches && view === 'detail';
    const label = inCategory ? '返回设置' : '返回笔记';
    back.setAttribute('aria-label', label);
    backTip.textContent = label;
    toolbarTitle.textContent = inCategory ? document.getElementById('h-' + current).textContent : '设置';
  }

  navLinks.forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    current = a.dataset.panel;
    view = 'detail';
    history.replaceState(null, '', '#' + current);
    main.scrollTop = 0;
    render();
    if (narrow.matches) document.getElementById('h-' + current).focus();
  }));

  back.addEventListener('click', () => {
    if (narrow.matches && view === 'detail') {
      view = 'nav';
      render();
      navLinks.find(a => a.dataset.panel === current).focus();
    }
    // 宽屏时返回笔记列表，由应用的路由处理。
  });

  narrow.addEventListener('change', () => { if (!narrow.matches) view = 'detail'; render(); });
  render();

  /* 名字和邮箱：失焦时保存，出错时在这一项下面说明 */
  function setMessage(input, msgEl, text, isError) {
    msgEl.textContent = text || '';
    msgEl.hidden = !text;
    msgEl.classList.toggle('is-danger', !!isError);
    if (isError) input.setAttribute('aria-invalid', 'true'); else input.removeAttribute('aria-invalid');
  }

  const nameInput = document.getElementById('acc-name');
  const nameMsg = document.getElementById('acc-name-msg');
  let savedName = nameInput.value;
  nameInput.addEventListener('blur', () => {
    const v = nameInput.value.trim();
    if (!v) { setMessage(nameInput, nameMsg, '名字不能为空，共享笔记时别人会看到它。', true); return; }
    nameInput.value = v;
    savedName = v;
    document.getElementById('delete-name').textContent = v;
    setMessage(nameInput, nameMsg, '', false);
  });
  nameInput.addEventListener('input', () => { if (nameInput.value.trim() && nameInput.getAttribute('aria-invalid')) setMessage(nameInput, nameMsg, '', false); });
  nameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') nameInput.blur();
    if (e.key === 'Escape') { nameInput.value = savedName; setMessage(nameInput, nameMsg, '', false); nameInput.blur(); }
  });

  const emailInput = document.getElementById('acc-email');
  const emailMsg = document.getElementById('acc-email-msg');
  let savedEmail = emailInput.value;
  const emailProblem = v => {
    if (!v) return '邮箱不能为空，登录和找回账户都要用到它。';
    if (!v.includes('@')) return '邮箱里少了 @，例如 name@example.com。';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return '邮箱不完整，例如 name@example.com。';
    return '';
  };
  emailInput.addEventListener('blur', () => {
    const v = emailInput.value.trim();
    const problem = emailProblem(v);
    if (problem) { setMessage(emailInput, emailMsg, problem, true); return; }
    emailInput.value = v;
    if (v !== savedEmail) setMessage(emailInput, emailMsg, '验证邮件已发到这个地址，确认后改用它登录。', false);
    else setMessage(emailInput, emailMsg, '', false);
  });
  emailInput.addEventListener('input', () => { if (emailInput.getAttribute('aria-invalid') && !emailProblem(emailInput.value.trim())) setMessage(emailInput, emailMsg, '', false); });
  emailInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') emailInput.blur();
    if (e.key === 'Escape') { emailInput.value = savedEmail; setMessage(emailInput, emailMsg, '', false); emailInput.blur(); }
  });

  /* 外观：改了立即生效 */
  document.querySelectorAll('.dn-segmented').forEach(group => {
    group.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      group.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
      if (group.id === 'theme') {
        const t = btn.dataset.themeValue;
        if (t) document.documentElement.setAttribute('data-theme', t);
        else document.documentElement.removeAttribute('data-theme');
      }
    });
  });

  /* 删除账户：先确认，要求输入邮箱 */
  const dialog = document.getElementById('delete-dialog');
  const confirmInput = document.getElementById('delete-confirm');
  const submit = document.getElementById('delete-submit');
  document.getElementById('delete-open').addEventListener('click', () => {
    document.getElementById('delete-email').textContent = savedEmail;
    confirmInput.value = '';
    submit.disabled = true;
    dialog.showModal();
    confirmInput.focus();
  });
  confirmInput.addEventListener('input', () => { submit.disabled = confirmInput.value.trim() !== savedEmail; });
  document.getElementById('delete-form').addEventListener('submit', e => e.preventDefault());
  confirmInput.addEventListener('keydown', e => { if (e.key === 'Enter') e.preventDefault(); });
  document.getElementById('delete-cancel').addEventListener('click', () => dialog.close());
  submit.addEventListener('click', () => { if (!submit.disabled) dialog.close('deleted'); });
})();
</script>
</body>
</html>
